<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubric Reader</title>
<meta name="description" content="Open a Rubric bilingual book (word-by-word glosses, grammar tags, teaching notes) and print it or save it as a PDF. Example: The Wonderful Wizard of Oz in Hebrew.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="reader.css">
<style>
:root{ --accent:#9E3B26; --accent2:#B5472F; --hi:#C9A227; --hi-soft:#F7EDCF; --ink:#1F2937; --muted:#5B6474; --line:#E1E4EA; --page:#EEF0F3; --bar:#3B0A14; --bad:#B0342B; --ok:#1E7F4F; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Lexend',Arial,sans-serif;font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.bar{background:var(--bar);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:3px solid var(--hi);flex-wrap:wrap}
.bar .brand{font-weight:600;font-size:16px;white-space:nowrap}
.bar .brand small{font-weight:300;opacity:.8;margin-left:6px}
.bar .sp{flex:1}
.bar a{color:#fff;opacity:.85;text-decoration:none;font-size:13px}
.bar a:hover{opacity:1;text-decoration:underline}
.tools{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:100px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.alt{background:#fff;color:var(--accent)}
.btn.alt:hover{background:#FBF4F3}
select{border:1px solid #C9CED8;border-radius:7px;padding:5px 8px;background:#fff;font-size:13px;max-width:100%}
label.ck{display:inline-flex;gap:5px;align-items:center;cursor:pointer;font-size:13px;white-space:nowrap}
.grp{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap}
.grp > b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.view{padding:22px 16px 60px}
.sheet{max-width:190mm;margin:0 auto;background:#fff;padding:14mm 13mm;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px -12px rgba(0,0,0,.25);border-radius:2px}
.empty{max-width:640px;margin:30px auto;text-align:center;color:var(--muted)}
.drop{border:2px dashed #C3C8D2;border-radius:14px;padding:30px 18px;background:#FAFBFC;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--hi);background:var(--hi-soft)}
.drop b{display:block;color:var(--accent);font-weight:500;font-size:16px;margin-bottom:4px}
.problems{max-width:190mm;margin:0 auto 14px;background:#FFF6F4;border:1px solid #F0C9C2;border-radius:10px;padding:10px 14px;font-size:13px}
.problems b{color:var(--bad)}
.problems ul{margin:6px 0 0;padding-left:20px;max-height:160px;overflow:auto}
.files{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){ .sheet{padding:7mm 5mm} .view{padding:12px 6px 40px} .tools{position:static} }
@media print{
  .bar,.tools,.problems,.empty{display:none!important}
  body{background:#fff}
  .view{padding:0}
  .sheet{max-width:none;margin:0;padding:0;box-shadow:none}
}
</style>
<style id="pagecss"></style>
</head>
<body>
<div class="bar">
  <span class="brand">Rubric<small>bilingual book reader</small></span>
  <span class="sp"></span>
  <a href="./">Make a book</a>
  <a href="https://veered.org/bilingual-book-maker/">About</a>
</div>
<div class="tools">
  <div class="grp">
    <button class="btn" id="openBtn">Open files…</button>
    <input type="file" id="fileIn" accept=".json,application/json" multiple hidden>
    <select id="example" aria-label="Example book">
      <option value="">Example: The Wizard of Oz in Hebrew…</option>
    </select>
  </div>
  <div class="grp">
    <b>Show</b>
    <label class="ck"><input type="checkbox" data-sw="gloss" checked> Glosses</label>
    <label class="ck"><input type="checkbox" data-sw="tags" checked> Grammar</label>
    <label class="ck"><input type="checkbox" data-sw="read" checked> Readings</label>
    <label class="ck"><input type="checkbox" data-sw="notes" checked> Notes</label>
    <label class="ck"><input type="checkbox" data-sw="line" checked> Paragraph text</label>
  </div>
  <div class="grp">
    <select id="size" aria-label="Text size"><option value="compact">Compact</option><option value="" selected>Normal</option><option value="big">Large</option></select>
    <select id="paper" aria-label="Paper size"><option value="A4">A4</option><option value="letter">Letter</option></select>
    <button class="btn alt" id="printBtn">Print / Save PDF</button>
  </div>
  <span class="files" id="files"></span>
</div>
<div class="view">
  <div class="problems" id="problems" hidden></div>
  <div class="empty" id="empty">
    <div class="drop" id="drop"><b>Drop your book's .json files here</b>or click to choose them. Several files at once are fine: the chapters are put in order.</div>
    <p>No book yet? Try the example above, or <a href="./">make one from a free book</a>.</p>
    <p style="font-size:12.5px">Files stay on your computer: nothing is uploaded.</p>
  </div>
  <div class="sheet" id="sheet" hidden><div class="book" id="book"></div></div>
</div>
<script src="reader.js"></script>
</body>
</html>
